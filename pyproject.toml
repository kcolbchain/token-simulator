[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-simulator"
version = "0.1.0"
description = "Token-economy simulator — burn tolls, vesting, revenue streams, endogenous price."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kcolbchain" }]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
token-simulator = "token_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["token_simulator*"]
